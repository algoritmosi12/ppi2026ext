<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Finalizado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

  <main class="container py-5">
    <h1 class="text-center fw-bold text-uppercase mb-5">Juego finalizado</h1>

    <div class="col-12 col-md-8 col-lg-6 mx-auto">
      <div class="border-bottom border-2 border-secondary pb-2 mb-3">
        <span class="fw-bold text-uppercase">Usuario:</span>
        <span id="usuario" class="ms-2"></span>
      </div>

      <div class="border-bottom border-2 border-secondary pb-2 mb-3">
        <span class="fw-bold text-uppercase">Tiempo:</span>
        <span id="tiempo" class="ms-2"></span>
      </div>

      <div class="border-bottom border-2 border-secondary pb-2 mb-3">
        <span class="fw-bold text-uppercase">Dinero:</span>
        <span id="dinero" class="ms-2"></span>
      </div>

      <div class="border-bottom border-2 border-secondary pb-2 mb-3">
        <span class="fw-bold text-uppercase">Clasificación:</span>
        <span id="clasificacion" class="badge fs-5 ms-2"></span>
        <p id="detalle" class="text-secondary mb-0 mt-2"></p>
      </div>

      <div class="text-center mt-4">
        <button type="button" id="btnanterior" value="pagina1.html" class="btn btn-info btn-lg fw-bold" value="index.html"> VOLVER A JUGAR</button>
      </div>
    </div>
  </main>

  <script src="../js/finalizar.js" type="module"></script>
</body>
</html>
