<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Finalizado</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    p {
      border-bottom: 1px solid #fff;
      padding: 16px 0;
      margin: 0;
      font-size: 1.2rem;
    }

    strong {
      display: inline-block;
      width: 180px;
    }
  </style>
</head>
<body>
  <main>
    <h1>JUEGO FINALIZADO</h1>
    <p><strong>USUARIO:</strong> <span id="usuario"></span></p>
    <p><strong>TIEMPO:</strong> <span id="tiempo"></span></p>
    <p><strong>DINERO:</strong> <span id="dinero"></span></p>
    <p><strong>CLASIFICACIÓN:</strong> <span id="clasificacion"></span></p>
  </main>
</body>
</html>
